<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HordaGun</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f14;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block;margin:0 auto}
  /* QR code para abrir no celular: só em telas largas (no celular já está jogando) */
  #qr{position:fixed;right:24px;bottom:24px;width:150px;padding:12px;border-radius:12px;
      background:#1a1d24;color:#e2e8f0;text-align:center;font-size:14px;line-height:1.3}
  #qr img{display:block;width:100%;border-radius:6px;margin-bottom:8px}
  @media (max-width:900px){#qr{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="qr"><img src="qrcode.svg" alt="QR code para jogar no celular">Jogue no celular</div>
<script src="audio.js"></script>
<script src="sprites.js"></script>
<script src="game.js"></script>
</body>
</html>
